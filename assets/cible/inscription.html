<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stynova - Inscription</title>
    <meta name="description" content="Créez votre compte sur Stynova pour participer au classement compétitif et suivre vos scores au jeu de cible.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <div class="logo-icon"></div>
            Stynova
        </a>
        <nav>
            <ul>
                <li id="nav-login"><a href="index.html">Connexion</a></li>
                <li id="nav-register"><a href="inscription.html">Inscription</a></li>
                <li id="nav-game" style="display:none;"><a href="jeu.html">Jouer</a></li>
                <li id="nav-scores"><a href="scores.html">Classement</a></li>
            </ul>
        </nav>
        <div class="user-menu" id="nav-user" style="display:none;">
            <span class="username" id="nav-username"></span>
            <button class="btn-logout" onclick="logout()">Déconnexion</button>
        </div>
    </header>

    <main>
        <div class="container">
            <h1><span>Créer</span> un compte</h1>
            
            <form id="register-form">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" required minlength="3" maxlength="20">
                    <div class="error-msg" id="username-error"></div>
                </div>

                <div class="form-group">
                    <label for="email">Adresse Email</label>
                    <input type="email" id="email" name="email" required>
                    <div class="error-msg" id="email-error"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required minlength="6">
                    <div class="error-msg" id="password-error"></div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirmer le mot de passe</label>
                    <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
                    <div class="error-msg" id="confirm_password-error"></div>
                </div>

                <div class="form-group">
                    <label for="birthdate">Date de naissance</label>
                    <input type="date" id="birthdate" name="birthdate" required>
                    <div class="error-msg" id="birthdate-error"></div>
                </div>

                <div class="form-group">
                    <label for="region">Région</label>
                    <select id="region" name="region" required>
                        <option value="">Sélectionnez une région...</option>
                        <!-- Options générées par JS -->
                    </select>
                    <div class="error-msg" id="region-error"></div>
                </div>
                
                <div class="error-msg" id="form-error" style="margin-bottom: 15px; text-align: center;"></div>
                
                <button type="submit" class="btn">S'inscrire</button>
                
                <div class="form-footer">
                    Vous avez déjà un compte ? <a href="index.html">Connectez-vous</a>.
                </div>
            </form>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/inscription.js"></script>
</body>
</html>
