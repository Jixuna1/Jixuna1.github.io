<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stynova - Connexion</title>
    <meta name="description" content="Connectez-vous à Stynova, le jeu de cible en ligne compétitif et détente. Ajustez vos tirs selon le vent et grimpez dans le classement.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <div class="logo-icon"></div>
            Stynova
        </a>
        <nav>
            <ul>
                <li id="nav-login"><a href="index.html">Connexion</a></li>
                <li id="nav-register"><a href="inscription.html">Inscription</a></li>
                <li id="nav-game" style="display:none;"><a href="jeu.html">Jouer</a></li>
                <li id="nav-scores"><a href="scores.html">Classement</a></li>
            </ul>
        </nav>
        <div class="user-menu" id="nav-user" style="display:none;">
            <span class="username" id="nav-username"></span>
            <button class="btn-logout" onclick="logout()">Déconnexion</button>
        </div>
    </header>

    <main>
        <div class="container">
            <h1><span>Connexion</span> au jeu</h1>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" required placeholder="Ex: Antoine">
                    <div class="error-msg" id="username-error"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required>
                    <div class="error-msg" id="password-error"></div>
                </div>
                
                <div class="error-msg" id="form-error" style="margin-bottom: 15px; text-align: center;"></div>
                
                <button type="submit" class="btn">Se connecter</button>
                
                <div class="form-footer">
                    Vous n'avez pas de compte ? <a href="inscription.html">Inscrivez-vous ici</a>.
                </div>
            </form>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/connexion.js"></script>
</body>
</html>
